[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "robo-evals"
version = "0.1.0"
description = "Reproducible evaluation harness for robot manipulation policies in MuJoCo simulation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["robotics", "evaluation", "mujoco", "manipulation", "benchmark", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.26",
  "imageio>=2.31",
  "pillow>=10.0",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.5"]
ws = ["websockets>=12.0"]
dev = [
  "imageio-ffmpeg>=0.5",
  "websockets>=12.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
robo-evals = "robo_evals.cli:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/robo-evals"
Issues = "https://github.com/superintelligenceco/robo-evals/issues"
Changelog = "https://github.com/superintelligenceco/robo-evals/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_evals"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
files = ["src/robo_evals"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*", "imageio", "imageio.*", "imageio_ffmpeg", "websockets", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: longer end-to-end evaluations"]
