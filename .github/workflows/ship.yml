name: Ship

# Builds the downloadable artifacts:
# - the wheel and sdist (workflow artifacts, and release assets for a tag)
# - a multi-arch (linux/amd64, linux/arm64) image on ghcr.io
#
# A pushed v* tag or a call from the Release workflow (when release-please
# creates a release) tags the image :vX.Y.Z and :latest and attaches the
# wheel, sdist, and SHA256SUMS to the GitHub Release. A manual dispatch pushes
# :edge and keeps the Python packages as workflow run artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach assets to, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install OSMesa for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - name: Smoke-test the wheel in a clean environment
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -m venv /tmp/wheel-venv
          wheel="$(ls dist/*.whl)"
          /tmp/wheel-venv/bin/pip install "${wheel}[video]"
          cd "$RUNNER_TEMP"
          /tmp/wheel-venv/bin/robo-evals --version
          /tmp/wheel-venv/bin/robo-evals run --policy scripted --suite smoke --episodes 2 \
            --video first --video-format mp4 --out smoke
          test -s smoke/scripted/report.json
          test -s smoke/scripted/videos/reach_ep000.mp4
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  image:
    name: Container image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Compute tags
        id: tags
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="$RELEASE_TAG"
            tags="${IMAGE}:${RELEASE_TAG},${IMAGE}:latest"
          else
            version="edge"
            tags="${IMAGE}:edge,${IMAGE}:sha-${GITHUB_SHA::7}"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "primary=${tags%%,*}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the pushed image
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" "$PRIMARY" \
            run --policy scripted --suite smoke --episodes 2 --video first --video-format mp4
          test -s out/results/scripted/report.json
          test -s out/results/scripted/videos/reach_ep000.mp4
          cat out/results/scripted/report.md

  release-assets:
    name: Attach assets to the release
    if: ${{ inputs.tag != '' || github.ref_type == 'tag' }}
    needs: [dist, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
