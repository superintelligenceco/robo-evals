name: Release

# Builds and publishes everything a release ships:
# - wheel and sdist, published to PyPI
# - standalone executables for Linux (x86_64, arm64), macOS (arm64), and Windows (x86_64)
# - a multi-arch container image on ghcr.io, scanned with Trivy and signed with cosign
# - an SPDX SBOM and SHA256SUMS, with build provenance attestations for the assets
#
# A pushed v* tag runs all of it and creates the GitHub Release. A manual
# dispatch is a dry run: it builds everything, pushes the :edge image, and
# publishes nothing else.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "$RELEASE_TAG" || { echo "tag $RELEASE_TAG does not match version $version"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for ${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install OSMesa for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - name: Smoke-test the wheel in a clean environment
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python -m venv /tmp/wheel-venv
          wheel="$(ls dist/*.whl)"
          /tmp/wheel-venv/bin/pip install "${wheel}[video]"
          cd "$RUNNER_TEMP"
          /tmp/wheel-venv/bin/robo-evals --version
          /tmp/wheel-venv/bin/robo-evals run --policy scripted --suite smoke --episodes 2 \
            --video first --video-format mp4 --out smoke
          test -s smoke/scripted/report.json
          test -s smoke/scripted/videos/reach_ep000.mp4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  binaries:
    name: Executable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        run: |
          python -m pip install pyinstaller ".[video,ws]"
          python scripts/build_binary.py
      - name: Smoke-test the executable on a real run
        shell: bash
        run: |
          set -eu
          mkdir smoke
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -q dist-bin/*.zip -d smoke
            exe="$PWD/smoke/robo-evals.exe"
          else
            tar -xzf dist-bin/*.tar.gz -C smoke
            exe="$PWD/smoke/robo-evals"
          fi
          cd "$RUNNER_TEMP"
          "$exe" --version
          "$exe" run --policy scripted --suite smoke --episodes 3 --out exe-out
          test -s exe-out/scripted/report.json
          python -c "import json; r = json.load(open('exe-out/scripted/report.json')); assert r['overall']['success_rate'] == 1.0, r['overall']"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: dist-bin/*
          if-no-files-found: error

  image:
    name: Container image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute tags
        id: tags
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="$RELEASE_TAG"
            tags="${IMAGE}:${RELEASE_TAG},${IMAGE}:latest"
          else
            version="edge"
            tags="${IMAGE}:edge,${IMAGE}:sha-${GITHUB_SHA::7}"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "primary=${tags%%,*}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the pushed image on a real run
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" "$PRIMARY" \
            run --policy scripted --suite smoke --episodes 2 --video first --video-format mp4
          test -s out/results/scripted/report.json
          test -s out/results/scripted/videos/reach_ep000.mp4
          cat out/results/scripted/report.md
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with cosign (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [dist, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{python-dist,binary-*}"
          path: assets
          merge-multiple: true
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: assets/robo-evals-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no changelog entry for $version"; exit 1; }
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file notes.md assets/*
