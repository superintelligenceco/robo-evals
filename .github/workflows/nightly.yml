name: Nightly

# Catches drift that a green push can hide: new dependency releases, a newer
# Python, and a larger evaluation than the per-push smoke test.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-dependencies:
    name: Latest dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install OSMesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - run: python -m pip install --upgrade -e ".[dev]"
      - name: Pytest with extra property-based examples
        env:
          HYPOTHESIS_PROFILE: nightly
        run: pytest
      - name: Full core suite, 50 episodes per task
        run: |
          robo-evals run --policy scripted --suite core --episodes 50 --seed 0 --out nightly-results
          python - <<'PY'
          import json
          report = json.load(open("nightly-results/scripted/report.json"))
          rate = report["overall"]["success_rate"]
          print("scripted success rate", rate)
          assert rate == 1.0, "the scripted baseline must solve every task"
          PY

  benchmarks:
    name: Benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest benchmarks --benchmark-only --benchmark-json=bench.json
      - name: Apply the gate
        run: python scripts/bench_gate.py bench.json | tee -a "$GITHUB_STEP_SUMMARY"
